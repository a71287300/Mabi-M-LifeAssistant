<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">瑪奇生活助手運行邏輯</title>
  <desc id="desc">從選取遊戲視窗、辨識生活力，到執行十次採集並循環檢查的流程圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111714"/>
      <stop offset="1" stop-color="#1b2a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f0ca"/>
      <stop offset="1" stop-color="#68bf8d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#82cda1"/>
    </marker>
    <style>
      .title { font: 700 28px 'Microsoft JhengHei UI','Segoe UI',sans-serif; fill: #f1f5f1; }
      .subtitle { font: 400 14px 'Microsoft JhengHei UI','Segoe UI',sans-serif; fill: #92a198; }
      .node-title { font: 700 17px 'Microsoft JhengHei UI','Segoe UI',sans-serif; fill: #f1f5f1; }
      .node-copy { font: 400 13px 'Microsoft JhengHei UI','Segoe UI',sans-serif; fill: #aebbb2; }
      .badge { font: 700 12px 'Segoe UI',sans-serif; fill: #13251a; }
      .label { font: 600 12px 'Microsoft JhengHei UI','Segoe UI',sans-serif; fill: #9fe0b6; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>
  <path d="M0 130 C220 40 420 210 650 110 S1000 60 1200 150" fill="none" stroke="#2a4937" stroke-width="2" opacity=".35"/>
  <path d="M0 640 C240 540 410 730 690 610 S1010 530 1200 640" fill="none" stroke="#2a4937" stroke-width="2" opacity=".35"/>
  <text x="54" y="62" class="title">瑪奇生活助手｜程式運行邏輯</text>
  <text x="54" y="90" class="subtitle">只在指定遊戲視窗內辨識與送出操作；辨識不確定時保持暫停。</text>

  <g filter="url(#shadow)">
    <rect x="54" y="142" width="250" height="128" rx="18" fill="#1b2a22" stroke="#3b5a48"/>
    <circle cx="88" cy="178" r="18" fill="url(#accent)"/>
    <text x="82" y="183" class="badge">01</text>
    <text x="118" y="179" class="node-title">選取遊戲視窗</text>
    <text x="78" y="217" class="node-copy">取得指定視窗畫面</text>
    <text x="78" y="239" class="node-copy">左側預覽只供確認</text>
  </g>
  <path d="M304 206 H354" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="370" y="142" width="250" height="128" rx="18" fill="#1b2a22" stroke="#3b5a48"/>
    <circle cx="404" cy="178" r="18" fill="url(#accent)"/>
    <text x="398" y="183" class="badge">02</text>
    <text x="434" y="179" class="node-title">等待開始條件</text>
    <text x="394" y="217" class="node-copy">輸入穩定（可關閉）</text>
    <text x="394" y="239" class="node-copy">畫面與指南針穩定</text>
  </g>
  <path d="M620 206 H670" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="686" y="142" width="250" height="128" rx="18" fill="#1b2a22" stroke="#3b5a48"/>
    <circle cx="720" cy="178" r="18" fill="url(#accent)"/>
    <text x="714" y="183" class="badge">03</text>
    <text x="750" y="179" class="node-title">開啟生活力指南</text>
    <text x="710" y="217" class="node-copy">指定視窗按下 C</text>
    <text x="710" y="239" class="node-copy">等待約 2 秒後開始辨識</text>
  </g>
  <path d="M936 206 H986" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1002" y="142" width="144" height="128" rx="18" fill="#214331" stroke="#75c999"/>
    <text x="1020" y="181" class="node-title">OCR + 定位</text>
    <text x="1020" y="216" class="node-copy">生活力卡片</text>
    <text x="1020" y="238" class="node-copy">技能進行按鈕</text>
  </g>

  <path d="M1074 270 V338" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="838" y="354" width="308" height="132" rx="18" fill="#1b2a22" stroke="#3b5a48"/>
    <circle cx="874" cy="390" r="18" fill="url(#accent)"/>
    <text x="868" y="395" class="badge">04</text>
    <text x="904" y="391" class="node-title">執行所選技能</text>
    <text x="864" y="429" class="node-copy">確認綠色「進行」後送出操作</text>
    <text x="864" y="451" class="node-copy">每輪自動完成 10 次採集</text>
  </g>
  <path d="M838 420 H774" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="446" y="354" width="312" height="132" rx="18" fill="#1b2a22" stroke="#3b5a48"/>
    <circle cx="482" cy="390" r="18" fill="url(#accent)"/>
    <text x="476" y="395" class="badge">05</text>
    <text x="512" y="391" class="node-title">工作狀態判定</text>
    <text x="472" y="429" class="node-copy">搜尋整張畫面的指南針與工作圖案</text>
    <text x="472" y="451" class="node-copy">ONNX 分類 + 多幀去抖動</text>
  </g>
  <path d="M446 420 H382" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="354" width="294" height="132" rx="18" fill="#1b2a22" stroke="#3b5a48"/>
    <circle cx="90" cy="390" r="18" fill="url(#accent)"/>
    <text x="84" y="395" class="badge">06</text>
    <text x="120" y="391" class="node-title">閒置後回到下一輪</text>
    <text x="80" y="429" class="node-copy">工作中暫停辨識與點擊</text>
    <text x="80" y="451" class="node-copy">回到閒置後再次循環</text>
  </g>
  <path d="M201 486 V570 H1074 V486" fill="none" stroke="#82cda1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="548" y="565" class="label">無限循環，直到按下暫停、PageDown 或 Esc</text>

  <rect x="54" y="610" width="1092" height="58" rx="16" fill="#132019" stroke="#2f4939"/>
  <circle cx="84" cy="639" r="8" fill="#a6e4c1"/>
  <text x="106" y="645" class="node-copy">安全原則：生活力、技能按鈕或工作狀態無法確認時，停止流程並顯示可複製的診斷資訊。</text>
</svg>
